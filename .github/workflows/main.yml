name: 抖音自动化运维引擎

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # 北京时间每天凌晨 03:00 运行

jobs:
  run-and-sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 设置时区为北京时间
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 启用 pip 缓存，加速后续运行

      - name: 📦 安装 Pip 依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests opencv-python-headless numpy

      - name: 🎭 安装 Playwright 浏览器
        # 移除 --with-deps，因为 ubuntu-latest 预装了大部分库。
        # 如果后续报错缺少库，再有针对性地添加。
        run: playwright install chromium

      - name: 🚀 执行任务
        run: python main.py

      - name: 💾 自动同步 Cookie 到仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Auto] 更新抖音登录 Cookie 状态"
          file_pattern: 'douyin_cookies.json'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
